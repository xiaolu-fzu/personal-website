
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head><body>
<div id="out">loading</div>
<script>
  var t = document.createElement('button');
  t.className = 'nav__toggle';
  document.body.appendChild(t);
  var res = [];
  res.push('innerWidth=' + window.innerWidth);
  res.push('nav__toggle display=' + getComputedStyle(t).display);
  // 也读 .nav__list
  var nl = document.createElement('nav'); nl.className='nav__list'; document.body.appendChild(nl);
  res.push('nav__list display=' + getComputedStyle(nl).display);
  document.getElementById('out').textContent = res.join('\
');
</script></body></html>
