<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>李嘉豪 · 个人作品集｜建议用电脑打开</title>
  <meta name="description" content="作品集入口：建议在电脑上打开，站内有可玩的小游戏、AI 助手小洄与多篇长文拆解。" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <style>
    .qr-page { min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px 18px 40px; background: var(--bg-gradient); }
    .qr-card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 26px 26px; box-shadow: 0 18px 50px -22px rgba(158,79,58,0.28); }
    .qr-kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent-2); margin-bottom: 14px; }
    .qr-name { font-family: var(--font-display); font-size: 34px; line-height: 1.1; margin: 0 0 8px;
      color: var(--text); letter-spacing: 0.02em; }
    .qr-sub { font-size: 13.5px; line-height: 1.65; color: var(--text-secondary); margin: 0 0 22px; }
    .qr-note { background: var(--surface-2); border: 1px solid var(--border-strong); border-left: 3px solid var(--accent);
      border-radius: 10px; padding: 16px 18px; margin-bottom: 22px; }
    .qr-note__title { display: block; font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .qr-note__title span { font-size: 18px; margin-right: 6px; }
    .qr-note p { font-size: 13px; line-height: 1.7; color: var(--text-secondary); margin: 0; }
    .qr-url { margin-bottom: 14px; }
    .qr-url__label { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 7px; }
    .qr-url__val { display: block; font-family: var(--font-mono); font-size: 13px; line-height: 1.5;
      color: var(--accent-3); background: var(--surface-3); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 13px; word-break: break-all; -webkit-user-select: all; user-select: all; }
    .qr-btn { display: block; width: 100%; border: 0; cursor: pointer; font-family: var(--font-body);
      font-size: 15.5px; font-weight: 600; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 11px; padding: 15px 18px; margin-bottom: 10px;
      box-shadow: 0 8px 20px -10px rgba(185,98,74,0.75); transition: transform .15s ease, box-shadow .15s ease; }
    .qr-btn:active { transform: translateY(1px); box-shadow: 0 4px 12px -8px rgba(185,98,74,0.8); }
    .qr-btn.is-done { background: linear-gradient(135deg, #7E6A47, #6b5a3c); }
    .qr-hint { font-size: 12px; color: var(--text-muted); text-align: center; margin: 0 0 18px; }
    .qr-open { display: block; text-align: center; font-size: 14px; color: var(--accent-2); text-decoration: none;
      padding: 12px; border: 1px solid var(--border-strong); border-radius: 10px; margin-bottom: 22px; }
    .qr-open:active { background: var(--surface-2); }
    .qr-foot { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.7;
      padding-top: 18px; border-top: 1px solid var(--border); }
    .qr-toast { position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 14px);
      background: #141413; color: #fff; font-size: 13.5px; padding: 12px 20px; border-radius: 999px;
      opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; white-space: nowrap; }
    .qr-toast.is-on { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <main class="qr-page">
    <div class="qr-card">
      <div class="qr-kicker">Portfolio</div>
      <h1 class="qr-name">李嘉豪</h1>
      <p class="qr-sub">做有数据思维的产品经理，和有产品视角的数据分析者</p>

      <div class="qr-note">
        <strong class="qr-note__title"><span aria-hidden="true">💻</span>建议用电脑打开</strong>
        <p>站内有可玩的小游戏、AI 助手「小洄」和多篇长文产品拆解——在电脑上体验更完整。</p>
      </div>

      <div class="qr-url">
        <span class="qr-url__label">网址</span>
        <span class="qr-url__val" id="siteUrl">xiaolu-fzu.github.io/personal-website</span>
      </div>

      <button class="qr-btn" id="saveBtn" type="button">点击保存网址</button>
      <p class="qr-hint">保存后可在电脑浏览器里粘贴打开</p>

      <a class="qr-open" href="./">仍然在手机上打开 →</a>

      <div class="qr-foot">
        福州大学（211）· 硕士在读 · 2027 届<br />
        福建福州
      </div>
    </div>
  </main>
  <div class="qr-toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var FULL = "https://xiaolu-fzu.github.io/personal-website/";
      var btn = document.getElementById("saveBtn");
      var toast = document.getElementById("toast");
      var val = document.getElementById("siteUrl");
      var timer = null;

      function say(msg) {
        toast.textContent = msg;
        toast.classList.add("is-on");
        if (timer) clearTimeout(timer);
        timer = setTimeout(function () { toast.classList.remove("is-on"); }, 2600);
      }

      function legacyCopy() {
        try {
          var ta = document.createElement("textarea");
          ta.value = FULL;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "-1000px";
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (e) { return false; }
      }

      /* 复制失败时的兜底：把网址选中，提示长按复制 */
      function selectUrl() {
        try {
          var r = document.createRange();
          r.selectNodeContents(val);
          var s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        } catch (e) {}
      }

      function done() {
        btn.textContent = "已复制，去电脑上粘贴打开";
        btn.classList.add("is-done");
        say("已复制到剪贴板");
      }

      btn.addEventListener("click", function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(FULL).then(done, function () {
            if (legacyCopy()) { done(); } else { selectUrl(); say("长按上方网址即可复制"); }
          });
        } else if (legacyCopy()) {
          done();
        } else {
          selectUrl();
          say("长按上方网址即可复制");
        }
      });

      val.addEventListener("click", function () {
        if (window.getSelection) {
          var r = document.createRange();
          r.selectNodeContents(val);
          var s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }
      });
    })();
  </script>
</body>
</html>
